# Text-to-SQL evaluation set v0 (notes 13d): 30 questions over Project 1's warehouse with
# ground-truth SQL, graded easy (one table), medium (joins), hard (a business definition from the
# glossary decides the answer). Scored by execution match, BIRD rule: set(gold rows) == set(pred rows).
# Reference date: the warehouse ends 2026-06-30. "Last month" = June 2026, "last quarter" = 2026 Q2.
# Every ground-truth query is executed by tests/test_eval_set.py and must return at least one row.
questions:
  # ---------------------------------------------------------------- easy: one table
  - id: E01
    difficulty: easy
    question: How many support cases have severity 1?
    sql: SELECT count(*) FROM "case" WHERE severity = 1
  - id: E02
    difficulty: easy
    question: How many cases are there in each case category?
    sql: SELECT category, count(*) FROM "case" GROUP BY category
  - id: E03
    difficulty: easy
    question: How many drives failed during the quarter according to telemetry?
    sql: SELECT count(*) FROM telemetry_drive_summary WHERE failed = 1
  - id: E04
    difficulty: easy
    question: What quantity of part PRT-0004 is on hand at depot DEPOT-EMEA?
    sql: SELECT on_hand FROM inventory WHERE depot_id = 'DEPOT-EMEA' AND part_id = 'PRT-0004'
  - id: E05
    difficulty: easy
    question: How many technicians are there in each region?
    sql: SELECT region, count(*) FROM technician GROUP BY region
  - id: E06
    difficulty: easy
    question: Which five drive models have the most failures, with their failure counts?
    sql: SELECT model, failure_count FROM drive_model ORDER BY failure_count DESC, model LIMIT 5
  - id: E07
    difficulty: easy
    question: How many dispatches ended with the outcome parts_not_available?
    sql: SELECT count(*) FROM dispatch WHERE outcome = 'parts_not_available'
  - id: E08
    difficulty: easy
    question: How many sites are in the APJ region?
    sql: SELECT count(*) FROM site WHERE region = 'APJ'
  - id: E09
    difficulty: easy
    question: How many runbooks exist for each product family?
    sql: SELECT product_family, count(*) FROM runbook GROUP BY product_family
  - id: E10
    difficulty: easy
    question: Which depot and part combinations are below their reorder point?
    sql: SELECT depot_id, part_id FROM inventory WHERE on_hand < reorder_point
  # ---------------------------------------------------------------- medium: joins
  - id: M01
    difficulty: medium
    question: How many cases were opened against assets in each site region?
    sql: >
      SELECT s.region, count(*) FROM "case" c JOIN installed_asset a ON a.asset_id = c.asset_id
      JOIN site s ON s.site_id = a.site_id GROUP BY s.region
  - id: M02
    difficulty: medium
    question: How many dispatches were there per product family?
    sql: >
      SELECT p.family, count(*) FROM dispatch d JOIN "case" c ON c.case_id = d.case_id
      JOIN installed_asset a ON a.asset_id = c.asset_id JOIN product p ON p.product_id = a.product_id GROUP BY p.family
  - id: M03
    difficulty: medium
    question: Which five parts (by part number) were used in the largest total quantity across dispatches?
    sql: >
      SELECT p.part_number, sum(dp.quantity) FROM dispatch_part dp JOIN part p ON p.part_id = dp.part_id
      GROUP BY p.part_number ORDER BY sum(dp.quantity) DESC, p.part_number LIMIT 5
  - id: M04
    difficulty: medium
    question: For dispatched cases, what is the average number of visits per case, by case category?
    sql: >
      SELECT c.category, avg(v.visits) FROM (SELECT case_id, max(visit_number) AS visits FROM dispatch GROUP BY case_id) v
      JOIN "case" c ON c.case_id = v.case_id GROUP BY c.category
  - id: M05
    difficulty: medium
    question: How many installed assets are there per product family?
    sql: SELECT p.family, count(*) FROM installed_asset a JOIN product p ON p.product_id = a.product_id GROUP BY p.family
  - id: M06
    difficulty: medium
    question: Which five technicians (by name) performed the most dispatches, with their counts?
    sql: >
      SELECT t.name, count(*) FROM dispatch d JOIN technician t ON t.technician_id = d.technician_id
      GROUP BY t.name ORDER BY count(*) DESC, t.name LIMIT 5
  - id: M07
    difficulty: medium
    question: List every part number with the name of its preferred supplier.
    sql: >
      SELECT p.part_number, s.name FROM part p JOIN part_supplier ps ON ps.part_id = p.part_id AND ps.preferred = true
      JOIN supplier s ON s.supplier_id = ps.supplier_id
  - id: M08
    difficulty: medium
    question: How many cases per severity were raised on Storage Array assets?
    sql: >
      SELECT c.severity, count(*) FROM "case" c JOIN installed_asset a ON a.asset_id = c.asset_id
      JOIN product p ON p.product_id = a.product_id WHERE p.family = 'Storage Array' GROUP BY c.severity
  - id: M09
    difficulty: medium
    question: What total quantity of drive-category parts was consumed by dispatches, per technician region?
    sql: >
      SELECT t.region, sum(dp.quantity) FROM dispatch_part dp JOIN part p ON p.part_id = dp.part_id AND p.category = 'drive'
      JOIN dispatch d ON d.dispatch_id = dp.dispatch_id JOIN technician t ON t.technician_id = d.technician_id GROUP BY t.region
  - id: M10
    difficulty: medium
    question: For each datacenter, how many drives are observed and how many of them failed?
    sql: SELECT datacenter, count(*), sum(failed) FROM telemetry_drive_summary GROUP BY datacenter
  # ---------------------------------------------------------------- hard: definitions matter
  - id: H01
    difficulty: hard
    needs: Reference date; Case (two timestamp formats)
    question: How many cases were opened last month?
    sql: >
      SELECT count(*) FROM "case" WHERE (CASE WHEN opened_at LIKE '__/__/____%' THEN to_timestamp(opened_at, 'MM/DD/YYYY HH24:MI')::timestamp
      ELSE opened_at::timestamp END) >= '2026-06-01' AND (CASE WHEN opened_at LIKE '__/__/____%' THEN to_timestamp(opened_at, 'MM/DD/YYYY HH24:MI')::timestamp
      ELSE opened_at::timestamp END) < '2026-07-01'
  - id: H02
    difficulty: hard
    needs: Case (two timestamp formats); Region (site of the asset); first visit
    question: What is the mean number of hours from case open to the first dispatch visit, by site region?
    sql: >
      WITH opened AS (SELECT case_id, asset_id, CASE WHEN opened_at LIKE '__/__/____%' THEN to_timestamp(opened_at, 'MM/DD/YYYY HH24:MI')::timestamp
      ELSE opened_at::timestamp END AS opened_ts FROM "case"),
      first_visit AS (SELECT case_id, min(scheduled_at) AS first_at FROM dispatch WHERE visit_number = 1 GROUP BY case_id)
      SELECT s.region, avg(EXTRACT(EPOCH FROM (f.first_at - o.opened_ts)) / 3600.0) FROM first_visit f JOIN opened o ON o.case_id = f.case_id
      JOIN installed_asset a ON a.asset_id = o.asset_id JOIN site s ON s.site_id = a.site_id GROUP BY s.region
  - id: H03
    difficulty: hard
    needs: Repeat Dispatch
    question: What is the repeat-dispatch rate by product family?
    sql: >
      SELECT p.family, avg(CASE WHEN d.visit_number > 1 THEN 1.0 ELSE 0.0 END) FROM dispatch d JOIN "case" c ON c.case_id = d.case_id
      JOIN installed_asset a ON a.asset_id = c.asset_id JOIN product p ON p.product_id = a.product_id GROUP BY p.family
  - id: H04
    difficulty: hard
    needs: Deflectable Case; Reference date
    question: How many deflectable cases were opened last quarter?
    sql: >
      WITH c AS (SELECT c.*, CASE WHEN opened_at LIKE '__/__/____%' THEN to_timestamp(opened_at, 'MM/DD/YYYY HH24:MI')::timestamp ELSE opened_at::timestamp END AS opened_ts FROM "case" c)
      SELECT count(*) FROM c JOIN installed_asset a ON a.asset_id = c.asset_id JOIN product p ON p.product_id = a.product_id
      WHERE c.opened_ts >= '2026-04-01' AND c.opened_ts < '2026-07-01'
      AND ((c.category IN ('how_to', 'config', 'firmware') AND c.severity >= 3) OR c.category = 'false_alarm')
      AND EXISTS (SELECT 1 FROM runbook r WHERE r.product_family = p.family AND r.category = c.category)
  - id: H05
    difficulty: hard
    needs: Fleet Health
    question: Which five sites have the worst fleet health, with their expected 30-day failures?
    sql: SELECT site_id, expected_failures_30d FROM fleet_risk_sites ORDER BY expected_failures_30d DESC, site_id LIMIT 5
  - id: H06
    difficulty: hard
    needs: Risky Pod
    question: How many risky pods are there?
    sql: >
      SELECT count(*) FROM (SELECT datacenter, vault_id, pod_id FROM telemetry_drive_summary WHERE failed = 1
      GROUP BY datacenter, vault_id, pod_id HAVING count(*) >= 2) x
  - id: H07
    difficulty: hard
    needs: Warranty Status; Reference date
    question: How many installed assets are in warranty, out of warranty, and of unknown warranty status?
    sql: >
      SELECT CASE WHEN warranty_end IS NULL THEN 'unknown' WHEN warranty_end >= DATE '2026-06-30' THEN 'in_warranty' ELSE 'out_of_warranty' END AS warranty_status,
      count(*) FROM installed_asset GROUP BY 1
  - id: H08
    difficulty: hard
    needs: Service Failure vs Failure; Installed Asset (serial prefix)
    question: How many service failures were recorded on assets whose drive never failed in telemetry?
    sql: >
      SELECT count(*) FROM "case" c JOIN installed_asset a ON a.asset_id = c.asset_id
      JOIN telemetry_drive_summary t ON upper(t.serial_number) = upper(regexp_replace(a.serial_number, '^(SG-|HGST_|TOS-|WD-|HIT-|OEM-)', ''))
      WHERE c.failure_reported = 1 AND t.failed = 0
  - id: H09
    difficulty: hard
    needs: Parts Lead Time
    question: What is the average parts lead time for drive-category parts?
    sql: >
      WITH lt AS (SELECT p.part_id, coalesce(min(ps.lead_time_days) FILTER (WHERE ps.preferred), min(ps.lead_time_days)) AS lead_time
      FROM part p JOIN part_supplier ps ON ps.part_id = p.part_id WHERE p.category = 'drive' GROUP BY p.part_id)
      SELECT avg(lead_time) FROM lt
  - id: H10
    difficulty: hard
    needs: Fleet Health; Case (open = closed_at null)
    question: At the site with the worst fleet health, how many assets have an open case?
    sql: >
      SELECT count(DISTINCT c.asset_id) FROM "case" c JOIN installed_asset a ON a.asset_id = c.asset_id
      WHERE c.closed_at IS NULL AND a.site_id = (SELECT site_id FROM fleet_risk_sites ORDER BY expected_failures_30d DESC, site_id LIMIT 1)
