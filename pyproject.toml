[project]
name = "knowledge-agents-pilot"
version = "0.1.0"
description = "Three governed Knowledge Agents on NVIDIA Auto Ontology, Elasticsearch and MCP, with evaluations and program artifacts"
requires-python = ">=3.13,<3.14"
dependencies = [
    "psycopg[binary]==3.2.9",
    "duckdb==1.3.2",
    "pyarrow==21.0.0",
    "elasticsearch==8.17.2",
    "httpx==0.28.1",
    "anthropic==1.3.0",
    "mcp==2.3.0",
    "pyyaml==6.0.2",
    "pandas==2.3.2",
    "matplotlib==3.10.6",
    "python-dotenv==1.1.1",
    "tenacity==9.1.2",
]

[dependency-groups]
dev = ["pytest==8.4.1", "pytest-asyncio==1.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
